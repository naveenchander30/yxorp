global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'yxorp-waf'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Yxorp WAF Metrics
  - job_name: 'yxorp-waf'
    static_configs:
      - targets: ['yxorp-waf:8081']
        labels:
          service: 'waf'
          instance: 'waf-1'
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
